<title>Home Page Mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#0B0E14;
    --surface:#12161F;
    --border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.14);
    --fg:#E7EAF0;
    --muted:#9AA4B2;
    --faint:#5B6472;
    --accent:#5FB8AE;
    --error:#C97066;
    --error-dim:rgba(201,112,102,0.14);
    --font-sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:var(--font-sans);
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding-inline:20px;
    padding-block:64px;
  }
  h1{text-wrap:balance; margin:0;}
  p{margin:0;}

  main{
    width:100%;
    max-width:24rem;
    display:flex;
    flex-direction:column;
    gap:28px;
  }
  h1{
    font-size:20px;
    font-weight:600;
    text-align:center;
  }
  .field-group{display:flex; flex-direction:column; gap:8px;}
  label{font-size:14px; font-weight:500; color:var(--fg);}
  .hint{font-size:13px; color:var(--muted); line-height:1.5;}

  #team-id{
    height:48px;
    border-radius:8px;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--fg);
    font-family:var(--font-mono);
    font-size:28px;
    font-variant-numeric:tabular-nums;
    padding:0 16px;
    letter-spacing:0.02em;
    width:100%;
    transition:border-color 150ms ease-in-out, outline-color 120ms ease-out;
  }
  #team-id::placeholder{color:var(--faint); font-size:22px;}
  #team-id:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
    border-color:var(--accent);
  }
  #team-id[aria-invalid="true"]{border-color:var(--error);}

  #go-button{
    height:48px;
    border-radius:8px;
    border:none;
    background:var(--accent);
    color:#08211D;
    font-family:var(--font-sans);
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    width:100%;
    transition:filter 120ms ease-out;
  }
  #go-button:hover{filter:brightness(1.06);}
  #go-button:active{filter:brightness(0.94);}
  #go-button:focus-visible{outline:2px solid var(--fg); outline-offset:2px;}

  #error{
    display:none;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--error);
    background:var(--error-dim);
    border:1px solid var(--error);
    border-radius:6px;
    padding:8px 10px;
  }
  #error.visible{display:flex;}
  #error svg{flex-shrink:0;}

  #nav-note{
    display:none;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--accent);
    text-align:center;
    font-variant-numeric:tabular-nums;
  }
  #nav-note.visible{display:block;}

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
</style>

<main>
  <h1>FPL Assistant</h1>

  <form id="form" novalidate>
    <div class="field-group">
      <label for="team-id">Team ID</label>
      <input
        id="team-id"
        name="team-id"
        type="text"
        inputmode="numeric"
        placeholder="1234567"
        autocomplete="off"
        aria-describedby="team-id-hint"
      />
      <span class="hint" id="team-id-hint">Look in your team's page address on the FPL website or app — the number there is your ID.</span>
      <div id="error" role="alert" aria-live="polite">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.4"/><path d="M7 4v3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="7" cy="9.6" r="0.9" fill="currentColor"/></svg>
        <span id="error-text"></span>
      </div>
    </div>

    <button id="go-button" type="submit" style="margin-top:20px;">View team</button>
  </form>

  <span id="nav-note" role="status"></span>
</main>

<script>
  const form = document.getElementById('form');
  const input = document.getElementById('team-id');
  const errorBox = document.getElementById('error');
  const errorText = document.getElementById('error-text');
  const navNote = document.getElementById('nav-note');

  function showError(message){
    errorText.textContent = message;
    errorBox.classList.add('visible');
    input.setAttribute('aria-invalid', 'true');
    input.setAttribute('aria-describedby', 'team-id-hint team-id-error');
    errorBox.id = 'team-id-error';
    navNote.classList.remove('visible');
  }

  function clearError(){
    errorBox.classList.remove('visible');
    input.removeAttribute('aria-invalid');
    input.setAttribute('aria-describedby', 'team-id-hint');
  }

  input.addEventListener('input', clearError);

  form.addEventListener('submit', function(e){
    e.preventDefault();
    const value = input.value.trim();

    if(value.length === 0){
      showError('Enter your team ID to continue.');
      return;
    }
    if(!/^[0-9]+$/.test(value)){
      showError('Team ID must be numbers only, like 1234567.');
      return;
    }

    clearError();
    // No real /teams/[teamId] route exists yet in this standalone mockup —
    // this note stands in for the immediate client-side navigation.
    navNote.textContent = 'Navigating to /teams/' + value + ' …';
    navNote.classList.add('visible');
  });
</script>
